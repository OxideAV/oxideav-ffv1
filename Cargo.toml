[package]
name = "oxideav-ffv1"
version = "0.0.9"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-ffv1"
authors = ["Mark Karpeles"]
description = "Pure-Rust FFV1 (RFC 9043) lossless intra-only video codec for oxideav"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-ffv1"
keywords = ["multimedia", "video", "ffv1", "lossless", "codec"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
oxideav-core = "0.1"

[dev-dependencies]
# Round 386 (depth-mode bench+profile): Criterion drives the `decode` /
# `encode` harnesses across the coder × depth × colorspace × slice-count
# matrix. Pinned to the same 0.5 line the other OxideAV crates with
# benches track. All bench inputs are synthesised in-bench from
# deterministic xorshift seeds — no committed fixtures.
criterion = "0.5"

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false
